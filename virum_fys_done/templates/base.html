<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Virum Fysioterapi{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #0ea5e9;
    --primary-hover: #0284c7;
    --bg: #f8fafc;
    --surface: #ffffff;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body { 
    font-family: 'Inter', system-ui, sans-serif; 
    margin: 0; padding: 0; 
    background-color: var(--bg); 
    color: var(--text); 
    line-height: 1.6;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }
  h1, h2, h3 { color: var(--text); margin-top: 0; }
  h1 { font-size: 2rem; font-weight: 600; margin-bottom: 1.5rem; }
  
  .card { 
    background: var(--surface); 
    border-radius: 12px; 
    padding: 2rem; 
    margin-bottom: 1.5rem; 
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid var(--border);
  }

  label { display: block; margin: 1rem 0 0.5rem; font-weight: 600; font-size: 0.95rem; }
  
  input[type=text], input[type=number], input[type=password], select, textarea {
    width: 100%; 
    padding: 0.75rem; 
    border: 1px solid var(--border); 
    border-radius: 8px; 
    font-family: inherit;
    font-size: 1rem;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
  }

  button, .btn { 
    background: var(--primary); 
    color: white; 
    border: none; 
    padding: 0.75rem 1.5rem; 
    border-radius: 8px; 
    cursor: pointer; 
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none; 
    display: inline-block; 
    transition: background 0.2s;
    margin-top: 1rem;
  }
  button:hover, .btn:hover { background: var(--primary-hover); }
  .btn-secondary { background: #e2e8f0; color: var(--text); }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-danger { background: var(--danger); padding: 0.4rem 0.8rem; font-size: 0.85rem; margin-top: 0; }
  .btn-danger:hover { background: #dc2626; }

  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th { text-align: left; padding: 1rem 0.5rem; border-bottom: 2px solid var(--border); color: var(--text-muted); font-weight: 600;}
  td { padding: 1rem 0.5rem; border-bottom: 1px solid var(--border); }
  
  .bar-container { background: #f1f5f9; border-radius: 999px; overflow: hidden; margin: 0.5rem 0 1rem; height: 24px; }
  .bar-fill { background: var(--primary); color: white; height: 100%; display: flex; align-items: center; padding-left: 10px; font-size: 0.8rem; font-weight: 600; transition: width 0.5s ease-out; }

  .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 600; }
  .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  
  .nav-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
  .nav-header a { color: var(--primary); text-decoration: none; font-weight: 600; }
  .nav-header a:hover { text-decoration: underline; }
  
  .spoergsmaal-block { background: var(--bg); padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--border); position: relative;}
</style>
</head>
<body>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
